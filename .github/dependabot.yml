# Mises à jour automatiques des dépendances.
# Patch et minor : regroupés par écosystème et auto-mergés si la CI passe
# (voir workflows/dependabot-automerge.yml). Les majeurs restent des PR
# individuelles à valider à la main.
#
# cooldown (pip/npm) : Dependabot attend 7 jours après la sortie d'une version
# avant de proposer le bump. Comme ces deux écosystèmes sont auto-mergés puis
# déployés sans revue humaine, ce délai laisse à l'écosystème le temps de repérer
# et retirer un paquet fraîchement compromis (les audits CI ne voient que les CVE
# déjà publiées). Ne s'applique pas aux images/actions, validées à la main.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/riftarium/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    cooldown:
      default-days: 7
    groups:
      python-mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(api)"

  - package-ecosystem: "npm"
    directory: "/riftarium/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    cooldown:
      default-days: 7
    groups:
      npm-mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(web)"

  # Application mobile Flutter. Dépendances directes seulement : les transitives
  # sont figées par le SDK Flutter (flutter_test → matcher, test_api…) et un bump
  # du seul pubspec.lock casse `flutter pub get`. `increase` relève aussi la
  # contrainte `^x.y.z` de pubspec.yaml, sinon le lock devient incohérent.
  # Auto-merge patch/minor comme pip et npm, conditionné au check mobile
  # (dependabot-automerge.yml attend mobile-check, non requis sur main).
  - package-ecosystem: "pub"
    directory: "/riftarium/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
    ignore:
      # 0.17 exige Dart ≥ 3.12 (Flutter > 3.41). À lever avec la montée de Flutter
      # (mobile.yml, WORKFLOW.md §4).
      - dependency-name: "google_mlkit_text_recognition"
        versions: [">=0.17.0"]
      - dependency-name: "google_mlkit_commons"
        versions: [">=0.13.0"]
    groups:
      pub-mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(mobile)"

  - package-ecosystem: "docker"
    directories:
      - "/riftarium/apps/api"
      - "/riftarium/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    commit-message:
      prefix: "deps(docker)"

  # compose.yaml épingle postgres et redis : ces serveurs ne sont dans aucun
  # Dockerfile, donc l'écosystème "docker" ci-dessus ne les voyait pas. Écosystème
  # distinct (Compose v2/v3), non auto-mergé : une base de données et un cache se
  # valident à la main. Le motif de Dependabot couvre compose.yaml et
  # compose.dev.yaml.
  - package-ecosystem: "docker-compose"
    directory: "/riftarium"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    commit-message:
      prefix: "deps(compose)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    commit-message:
      prefix: "deps(ci)"
