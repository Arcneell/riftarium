# Mises à jour automatiques des dépendances.
# Patch et minor : regroupés par écosystème et auto-mergés si la CI passe
# (voir workflows/dependabot-automerge.yml). Les majeurs restent des PR
# individuelles à valider à la main.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/riftarium/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    groups:
      python-mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(api)"

  - package-ecosystem: "npm"
    directory: "/riftarium/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    groups:
      npm-mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: "docker"
    directories:
      - "/riftarium/apps/api"
      - "/riftarium/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Indian/Reunion"
    commit-message:
      prefix: "deps(ci)"
