version: 2
updates:
  - package-ecosystem: npm
    directory: /riftarium/apps/web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /riftarium/apps/api
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  # Majors Docker gérés à la main (Node : LTS pairs uniquement, jamais les
  # versions impaires non-LTS que Dependabot propose sinon).
  - package-ecosystem: docker
    directory: /riftarium/apps/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /riftarium/apps/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
