name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-jwt-secret-must-be-24-chars
  DB_PASSWORD: ci-db-password-long-enough
  ADMIN_TOKEN: ci-admin-token-16ch
  REDIS_PASSWORD: ci-redis-password-ok

jobs:
  api:
    name: api-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riftarium/apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: riftarium/apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q --cov=app --cov-report=term-missing

  web:
    name: web-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riftarium/apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: riftarium/apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  compose:
    name: compose-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: docker compose -f riftarium/compose.yaml config --quiet
      - run: python riftarium/scripts/check_compose_security.py
      - name: nginx -t
        run: >
          docker run --rm --add-host api:127.0.0.1
          -v ${{ github.workspace }}/riftarium/apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
          nginx:1.31-alpine nginx -t
      - name: Pas de secrets d'exemple dans Compose
        run: |
          if grep -E 'dev-secret-change-me|riftarium-dev' riftarium/compose.yaml; then
            echo "valeurs d'exemple encore présentes dans compose.yaml" >&2
            exit 1
          fi
