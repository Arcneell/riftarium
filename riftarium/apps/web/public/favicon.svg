<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="Logo Riftarium">
  <title>Riftarium</title>
  <!-- Sceau de forge (charte « Forge noxienne ») : mêmes tracés que src/components/Logo.vue. -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cfa6"/>
      <stop offset=".55" stop-color="#b08d5f"/>
      <stop offset="1" stop-color="#6e5536"/>
    </linearGradient>
    <linearGradient id="sang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset=".5" stop-color="#d23a33"/>
      <stop offset="1" stop-color="#8e1b20"/>
    </linearGradient>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="34,4 86,4 116,34 116,86 86,116 34,116 4,86 4,34" fill="#0d0d0f" stroke="url(#bronze)" stroke-width="5"/>
  <polygon points="37,13 83,13 107,37 107,83 83,107 37,107 13,83 13,37" fill="none" stroke="#d6b98c" stroke-width="1" opacity=".35"/>
  <g transform="rotate(-8 60 60)">
    <path d="M40 30 H80 V90 H40 Z" fill="#17120f" stroke="url(#bronze)" stroke-width="3.5"/>
    <path d="M63 26 L54 50 L64 58 L52 94" fill="none" stroke="url(#sang)" stroke-width="6" stroke-linejoin="miter" filter="url(#lueur)"/>
  </g>
</svg>
