# En-têtes de sécurité communs, inclus par le bloc server ET par chaque location
# qui pose ses propres `add_header` : dans nginx, un `add_header` local annule TOUS
# ceux hérités du niveau supérieur. Ils étaient donc recopiés à l'identique cinq
# fois, avec le risque qu'une CSP mise à jour n'en corrige que quatre.
#
# Pas de HSTS ici : BunkerWeb termine le TLS. CSP / XFO sont conservés en amont
# (KEEP_UPSTREAM_HEADERS côté BunkerWeb) pour les visuels CDN Riot.
#
# Fichier copié à /etc/nginx/security-headers.conf par le Dockerfile — délibérément
# hors de conf.d/, dont tous les *.conf sont chargés dans le contexte http.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https://cmsassets.rgpub.io https://assetcdn.rgpub.io; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'" always;
