# Réseaux privés uniquement : BunkerWeb (ou un autre reverse proxy Docker) est
# le seul pair autorisé à poser X-Real-IP. Un accès direct public n'est pas
# publié (bind 127.0.0.1).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Real-IP;
real_ip_recursive on;

# DNS interne de Docker : l'upstream api est résolu dynamiquement (via la
# variable $api_upstream), nginx démarre et survit même si api change d'IP.
resolver 127.0.0.11 valid=10s;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Robots d'aperçu de lien (Discord, Bluesky, Slack…) : ils ne lisent pas le
# JavaScript et ne verraient que les méta génériques de index.html. Eux seuls
# sont envoyés sur /api/decks/{id}/preview ; les humains reçoivent l'application.
map $http_user_agent $link_preview_bot {
  default 0;
  "~*(discordbot|slackbot|twitterbot|facebookexternalhit|facebot|telegrambot|whatsapp|linkedinbot|redditbot|pinterest|embedly|iframely|bluesky|mastodon|skypeuripreview|vkshare|applebot|nuzzel|quora link preview)" 1;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  server_tokens off;

  # Upstream en variable : force la résolution DNS à l'exécution (cf. resolver).
  # Sans URI dans proxy_pass, l'URI d'origine est transmise telle quelle.
  set $api_upstream http://api:8000;

  # Keep-alive vers l'upstream (proxy_set_header Connection "" par location,
  # car un proxy_set_header local annule l'héritage).
  proxy_http_version 1.1;

  # En-têtes de sécurité : un seul fichier, inclus ici et dans chaque location qui
  # pose ses propres add_header (un add_header local annule ceux hérités).
  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # Limite stricte : uniquement les endpoints qui manipulent des identifiants.
  location ~ ^/api/auth/(login|register|password)$ {
    limit_req zone=auth burst=4 nodelay;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  # Lectures de session (me, avatars, export) : plus de limite dédiée.
  location /api/auth/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  # Bundles Vite avec hash dans le nom : cache long, immuable.
  # `^~` : la correspondance de préfixe gagne d'emblée, sans évaluer les
  # expressions régulières (dont celle des icônes plus bas, qui ramènerait un
  # /assets/*.png de 1 an à 30 jours).
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # Manifest PWA : nginx ne connaît pas l'extension .webmanifest (servie en
  # application/octet-stream sinon) ; certains lanceurs Android/Windows ignorent
  # alors les icônes. Type explicite + cache court (le fichier change rarement).
  location = /site.webmanifest {
    types {}
    default_type application/manifest+json;
    expires 1h;
    add_header Cache-Control "public";
    include /etc/nginx/security-headers.conf;
  }

  # Moteur OCR du scanner (tesseract.js : worker, cœur wasm, modèle de langue),
  # copié depuis node_modules au build (vite.config.js). Fichiers non
  # fingerprintés mais versionnés par le chemin : cache long.
  location /ocr/ {
    expires 30d;
    add_header Cache-Control "public";
    include /etc/nginx/security-headers.conf;
  }

  # Service worker : jamais mis en cache par le navigateur, pour que les
  # nouvelles versions (précache, stratégies) soient détectées immédiatement.
  location = /sw.js {
    expires -1;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Règles officielles : le service worker les sert en stale-while-revalidate, donc
  # une heure de cache navigateur ne faisait que retarder d'autant sa révalidation.
  location /data/ {
    expires 5m;
  }

  # Icônes et favicon (onglet, écran d'accueil, manifest) : fichiers stables, servis
  # depuis la racine. Pas d'add_header ici, pour hériter des en-têtes de sécurité du
  # bloc server. /sw.js et /site.webmanifest ont des locations exactes (= …), qui
  # gagnent toujours sur une expression régulière ; index.html ne correspond pas.
  # Une regex est évaluée AVANT le préfixe /api/ : on exclut explicitement l'API,
  # qui sert elle-même des images (/api/decks/{id}/og.png, aperçu Open Graph).
  location ~* ^(?!/api/).+\.(png|svg|ico)$ {
    expires 30d;
  }

  # Page d'un deck : un robot d'aperçu est réécrit vers les méta Open Graph
  # (rewrite ... last repasse par location /api/, donc par le proxy).
  location ~ ^/decks/[0-9]+/?$ {
    if ($link_preview_bot) {
      rewrite ^/decks/([0-9]+)/?$ /api/decks/$1/preview last;
    }
    try_files $uri /index.html;
    expires -1;
  }

  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
