# Réseaux privés uniquement : BunkerWeb (ou un autre reverse proxy Docker) est
# le seul pair autorisé à poser X-Real-IP. Un accès direct public n'est pas
# publié (bind 127.0.0.1).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Real-IP;
real_ip_recursive on;

# DNS interne de Docker : l'upstream api est résolu dynamiquement (via la
# variable $api_upstream), nginx démarre et survit même si api change d'IP.
resolver 127.0.0.11 valid=10s;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Robots d'aperçu de lien (Discord, Bluesky, Slack…) : ils ne lisent pas le
# JavaScript et ne verraient que les méta génériques de index.html. Eux seuls
# sont envoyés sur /api/decks/{id}/preview ; les humains reçoivent l'application.
map $http_user_agent $link_preview_bot {
  default 0;
  "~*(discordbot|slackbot|twitterbot|facebookexternalhit|facebot|telegrambot|whatsapp|linkedinbot|redditbot|pinterest|embedly|iframely|bluesky|mastodon|skypeuripreview|vkshare|applebot|nuzzel|quora link preview)" 1;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  server_tokens off;

  # Upstream en variable : force la résolution DNS à l'exécution (cf. resolver).
  # Sans URI dans proxy_pass, l'URI d'origine est transmise telle quelle.
  set $api_upstream http://api:8000;

  # Keep-alive vers l'upstream (proxy_set_header Connection "" par location,
  # car un proxy_set_header local annule l'héritage).
  proxy_http_version 1.1;

  # Pas de HSTS ici : BunkerWeb termine le TLS. CSP / XFO conservés en amont
  # (KEEP_UPSTREAM_HEADERS côté BunkerWeb) pour les visuels CDN Riot.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https://cmsassets.rgpub.io https://assetcdn.rgpub.io; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  # Limite stricte : uniquement les endpoints qui manipulent des identifiants.
  location ~ ^/api/auth/(login|register|password)$ {
    limit_req zone=auth burst=4 nodelay;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  # Lectures de session (me, avatars, export) : plus de limite dédiée.
  location /api/auth/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  # Bundles Vite avec hash dans le nom : cache long, immuable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header dans un location annule ceux hérités du server : on
    # redéclare les en-têtes de sécurité ci-dessus.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https://cmsassets.rgpub.io https://assetcdn.rgpub.io; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
  }

  # Service worker : jamais mis en cache par le navigateur, pour que les
  # nouvelles versions (précache, stratégies) soient détectées immédiatement.
  location = /sw.js {
    expires -1;
    add_header Cache-Control "no-cache";
    # add_header dans un location annule ceux hérités du server : on
    # redéclare les en-têtes de sécurité ci-dessus.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https://cmsassets.rgpub.io https://assetcdn.rgpub.io; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
  }

  location /data/ {
    expires 1h;
  }

  # Page d'un deck : un robot d'aperçu est réécrit vers les méta Open Graph
  # (rewrite ... last repasse par location /api/, donc par le proxy).
  location ~ ^/decks/[0-9]+/?$ {
    if ($link_preview_bot) {
      rewrite ^/decks/([0-9]+)/?$ /api/decks/$1/preview last;
    }
    try_files $uri /index.html;
    expires -1;
  }

  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
