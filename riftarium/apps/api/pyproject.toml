[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]
"tests/conftest.py" = ["S", "E402", "I001"]
"app/config.py" = ["S105"]
"app/demo.py" = ["S105", "S311"]
"app/main.py" = ["S105"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
