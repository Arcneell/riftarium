# Configuration Alembic de l'API Riftarium.
# L'URL de la base n'est PAS ici : env.py lit app.config.settings.database_url
# (variable d'environnement DATABASE_URL), comme le reste de l'application.

[alembic]
# %(here)s = dossier de ce fichier : fonctionne en local (apps/api) comme dans l'image (/srv).
script_location = %(here)s/alembic

# Rend le paquet `app` importable quand la CLI est lancée depuis apps/api.
prepend_sys_path = .
path_separator = os

# Journalisation (consommée par env.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
