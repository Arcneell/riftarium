name: riftarium_mobile
description: "Riftarium — application mobile iOS et Android (Flutter)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.0+2
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  google_mlkit_text_recognition: ^0.16.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # Règles officielles embarquées (consultation hors ligne). Copie de
  # riftarium/data/rules-fr.json : à recopier quand ce fichier change
  # (cp ../../data/rules-fr.json assets/rules/rules-fr.json).
  assets:
    - assets/rules/rules-fr.json
    # Guides (débutant + aide avancée) exportés depuis apps/web/src/rules/*.js :
    # node --input-type=module -e "…" (voir WORKFLOW.md §6, règles).
    - assets/rules/guides-fr.json
  # Polices du site (OFL) : Marcellus (titres), Outfit (texte, variable),
  # IBM Plex Mono (codes, prix, badges).
  fonts:
    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
