# Journalisation bornée sur tous les services : évite de remplir le disque du VPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: riftarium-db
    environment:
      POSTGRES_DB: riftarium
      POSTGRES_USER: riftarium
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftarium -d riftarium"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: riftarium-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    logging: *logging
    # maxmemory 128mb côté Redis + marge pour le processus lui-même.
    mem_limit: 192m
    restart: unless-stopped

  api:
    build: apps/api
    container_name: riftarium-api
    environment:
      RIFTARIUM_ENV: prod
      DATABASE_URL: postgresql+psycopg://riftarium:${DB_PASSWORD}@db:5432/riftarium
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set}
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      AUTO_SYNC: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Moindre privilège : aucun capability, pas d'escalade possible.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    mem_limit: 512m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: riftarium-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8888}:8080"
    # Seul le front est visible depuis BunkerWeb ; api/db/redis restent sur
    # le réseau interne du projet.
    networks:
      - default
      - bunkerweb
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    mem_limit: 128m
    restart: unless-stopped

networks:
  # Réseau interne du projet (api, db, redis n'existent que là).
  default:
  # Réseau partagé avec BunkerWeb, créé à la main sur le VPS :
  #   docker network create bunkerweb
  # puis rattacher le conteneur BunkerWeb à ce réseau (voir README).
  # En dev, compose.dev.yaml le redéfinit en réseau local (pas de pré-création).
  bunkerweb:
    external: true

volumes:
  dbdata:
